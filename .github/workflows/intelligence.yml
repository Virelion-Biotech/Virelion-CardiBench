name: CardiBench intelligence refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
concurrency:
  group: cardibench-intelligence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: Collect bounded evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
        run: |
          DATE="$(date -u +%F)"
          cardibench discover --sources pubmed,geo,crossref,zenodo,github,openalex,biorxiv,medrxiv --limit 25 --lookback-days 30 --output "data/intelligence/snapshots/${DATE}.json"
      - run: cardibench build-catalog --snapshots-dir data/intelligence/snapshots --output data/intelligence/catalog.json --overrides data/intelligence/identity_overrides.json
      - name: Build release and dashboard
        run: |
          cardibench intelligence-report --catalog data/intelligence/catalog.json --results data/intelligence/results.json --json
          cardibench release-intelligence --catalog data/intelligence/catalog.json --results data/intelligence/results.json --output data/intelligence/release.json
          cardibench build-dashboard --catalog data/intelligence/catalog.json --results data/intelligence/results.json --release data/intelligence/release.json --output site/intelligence/index.html
      - name: Validate
        run: |
          pytest -q
          cardibench validate-all-manifests
          cardibench audit .
      - name: Commit changed intelligence products
        run: |
          git config user.name "cardibench-bot"
          git config user.email "cardibench-bot@users.noreply.github.com"
          git add data/intelligence/snapshots data/intelligence/catalog.json data/intelligence/release.json site/intelligence/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh CardiBench intelligence $(date -u +%F)"
          git push origin HEAD:main
